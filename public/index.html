<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Heist</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="screen-menu" class="screen active">
  <h1>Office Heist</h1>
  <p class="tagline">One of you isn't here to work.</p>
  <input id="name-input" type="text" placeholder="Your name" maxlength="16" />

  <div class="menu-card">
    <h2>Create a game</h2>
    <button id="create-btn">Create Room</button>
  </div>

  <div class="menu-card">
    <h2>Join a game</h2>
    <input id="join-code-input" type="text" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase" />
    <button id="join-btn">Join Room</button>
  </div>

  <p id="menu-error" class="error"></p>
</div>

<div id="screen-lobby" class="screen">
  <h1>Lobby — <span id="lobby-code"></span></h1>
  <ul id="lobby-players"></ul>
  <button id="start-btn">Start Game</button>
  <p id="lobby-hint" class="hint">Waiting for the host to start&hellip;</p>
</div>

<div id="screen-game" class="screen">
  <div id="hud">
    <div id="hud-left">Tasks: <span id="hud-tasks">0/0</span></div>
    <div id="hud-role" class="hud-role"></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
  </div>
  <div id="action-prompt" class="action-prompt hidden"></div>
  <div id="task-overlay" class="overlay hidden">
    <div class="task-box">
      <h3 id="task-label"></h3>
      <div class="task-bar"><div id="task-bar-fill"></div></div>
      <p class="hint">Hold E to complete</p>
    </div>
  </div>
</div>

<div id="screen-meeting" class="screen">
  <h1>Emergency Meeting</h1>
  <p id="meeting-message"></p>
  <div id="meeting-timer" class="hint"></div>
  <ul id="meeting-players"></ul>
  <button id="vote-skip-btn" class="skip-btn">Skip Vote</button>
</div>

<div id="screen-end" class="screen">
  <h1 id="end-title"></h1>
  <p id="end-message"></p>
  <ul id="end-roles"></ul>
  <button id="again-btn">Back to Lobby</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
